name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - uses: actions/cache@v4
        with:
          path: .build
          key: spm-${{ runner.os }}-${{ hashFiles('Package.resolved') }}
          restore-keys: spm-${{ runner.os }}-

      - name: Unit tests
        run: make test

      - name: Build the app bundle
        run: make app

      - name: Check the bundle
        run: |
          test -x build/LightsOut.app/Contents/MacOS/LightsOut
          test -d build/LightsOut.app/Contents/Frameworks/Sparkle.framework
          codesign --verify --deep build/LightsOut.app
